<p><a style="display:inline-block;background:#8c5a3c;color:#ffffff;padding:12px 20px;border-radius:8px;text-decoration:none;font-family:Arial,sans-serif" href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=recovery&siguiente=/nueva-contrasena">Elegir mi contraseña nueva</a></p>
